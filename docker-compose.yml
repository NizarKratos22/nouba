services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      MONGODB_URI: mongodb://mongo:27017/nouba
      NEXT_PUBLIC_APP_URL: http://localhost:3000

volumes:
  mongo-data:
